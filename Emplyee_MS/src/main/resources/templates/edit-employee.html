<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edit Employee</title>

<!-- Bootstrap CSS -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

<!-- Bootstrap Icons -->
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


<style>
body {
	background-color: #f5f7fb;
}

.navbar-brand {
	font-weight: bold;
}

.form-card {
	max-width: 850px;
	margin: 40px auto;
	border: none;
	border-radius: 15px;
}

.form-header {
	background: linear-gradient(135deg, #ffc107, #ffca2c);
	color: #212529;
	padding: 25px;
	border-radius: 15px 15px 0 0;
}

.form-label {
	font-weight: 600;
}

.required {
	color: red;
}

.employee-id-box {
	background-color: #e9ecef;
	font-weight: bold;
}
</style>

</head>


<body>


	<!-- ================================================= -->
	<!-- NAVIGATION BAR -->
	<!-- ================================================= -->

	<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

		<div class="container">

			<a class="navbar-brand" href="/"> <i class="bi bi-people-fill"></i>

				Employee Management System

			</a>


			<button class="navbar-toggler" type="button"
				data-bs-toggle="collapse" data-bs-target="#navbarMenu">

				<span class="navbar-toggler-icon"></span>

			</button>


			<div class="collapse navbar-collapse" id="navbarMenu">

				<ul class="navbar-nav ms-auto">

					<li class="nav-item"><a class="nav-link" href="/"> Home </a></li>


					<li class="nav-item"><a class="nav-link" href="/employees/add">
							Add Employee </a></li>


					<li class="nav-item"><a class="nav-link" href="/employees">
							Employee List </a></li>


					<li class="nav-item"><a class="nav-link"
						href="/employees/search"> Search </a></li>

				</ul>

			</div>

		</div>

	</nav>


	<!-- ================================================= -->
	<!-- MAIN CONTAINER -->
	<!-- ================================================= -->

	<div class="container">


		<div class="card shadow form-card">


			<!-- ================================================= -->
			<!-- HEADER -->
			<!-- ================================================= -->

			<div class="form-header">

				<h3 class="mb-1">

					<i class="bi bi-pencil-square"></i> Edit Employee

				</h3>

				<p class="mb-0">Update employee information.</p>

			</div>


			<!-- ================================================= -->
			<!-- FORM BODY -->
			<!-- ================================================= -->

			<div class="card-body p-4">


				<!-- ================================================= -->
				<!-- ERROR MESSAGE -->
				<!-- ================================================= -->

				<div th:if="${errorMessage}"
					class="alert alert-danger alert-dismissible fade show">

					<i class="bi bi-exclamation-triangle-fill"></i> <span
						th:text="${errorMessage}"> Error message </span>

					<button type="button" class="btn-close" data-bs-dismiss="alert">
					</button>

				</div>


				<!-- ================================================= -->
				<!-- UPDATE FORM -->
				<!-- ================================================= -->

				<form th:action="@{/employees/update}" th:object="${employee}"
					method="post">


					<div class="row g-3">


						<!-- ================================================= -->
						<!-- EMPLOYEE ID -->
						<!-- ================================================= -->

						<div class="col-md-6">

							<label class="form-label"> Employee ID </label> <input
								type="number" class="form-control employee-id-box"
								th:field="*{employeeId}" readonly>

							<div class="form-text">Employee ID cannot be changed.</div>

						</div>


						<!-- ================================================= -->
						<!-- NAME -->
						<!-- ================================================= -->

						<div class="col-md-6">

							<label class="form-label"> Employee Name <span
								class="required">*</span>

							</label> <input type="text" class="form-control" th:field="*{name}"
								placeholder="Enter employee name" required>

						</div>


						<!-- ================================================= -->
						<!-- EMAIL -->
						<!-- ================================================= -->

						<div class="col-md-6">

							<label class="form-label"> Email <span class="required">*</span>

							</label> <input type="email" class="form-control" th:field="*{email}"
								placeholder="example@gmail.com" required>

						</div>


						<!-- ================================================= -->
						<!-- MOBILE -->
						<!-- ================================================= -->

						<div class="col-md-6">

							<label class="form-label"> Mobile Number <span
								class="required">*</span>

							</label> <input type="text" class="form-control" th:field="*{mobile}"
								placeholder="10 digit mobile number" pattern="[0-9]{10}"
								maxlength="10" required>


							<div class="form-text">Enter exactly 10 digits.</div>

						</div>


						<!-- ================================================= -->
						<!-- DEPARTMENT -->
						<!-- ================================================= -->

						<div class="col-md-6">

							<label class="form-label"> Department <span
								class="required">*</span>

							</label> <select class="form-select" th:field="*{department}" required>


								<option value="">-- Select Department --</option>


								<option value="IT">IT</option>


								<option value="HR">HR</option>


								<option value="Finance">Finance</option>


								<option value="Sales">Sales</option>


								<option value="Marketing">Marketing</option>


							</select>

						</div>


						<!-- ================================================= -->
						<!-- DESIGNATION -->
						<!-- ================================================= -->

						<div class="col-md-6">

							<label class="form-label"> Designation <span
								class="required">*</span>

							</label> <input type="text" class="form-control"
								th:field="*{designation}" placeholder="e.g. Java Developer"
								required>

						</div>


						<!-- ================================================= -->
						<!-- SALARY -->
						<!-- ================================================= -->

						<div class="col-md-6">

							<label class="form-label"> Salary <span class="required">*</span>

							</label>


							<div class="input-group">

								<span class="input-group-text"> ₹ </span> <input type="number"
									class="form-control" th:field="*{salary}"
									placeholder="Enter salary" min="10001" step="0.01" required>

							</div>


							<div class="form-text">Salary must be greater than ₹10,000.

							</div>

						</div>


						<!-- ================================================= -->
						<!-- JOINING DATE -->
						<!-- ================================================= -->

						<div class="col-md-6">

							<label class="form-label"> Joining Date <span
								class="required">*</span>

							</label> 
							
							<input 
							  type="date" 
							  class="form-control" 
							  name="joiningDate"
							  th:value="${employee.joiningDate}" 
							  required>

						</div>


					</div>


					<!-- ================================================= -->
					<!-- BUTTONS -->
					<!-- ================================================= -->

					<div class="mt-4 d-flex gap-2">


						<button type="submit" class="btn btn-warning">

							<i class="bi bi-check-circle"></i> Update Employee

						</button>


						<a href="/employees" class="btn btn-secondary"> <i
							class="bi bi-x-circle"></i> Cancel

						</a> <a href="/employees/search" class="btn btn-outline-dark"> <i
							class="bi bi-search"></i> Search

						</a>


					</div>


				</form>

			</div>

		</div>

	</div>


	<!-- ================================================= -->
	<!-- FOOTER -->
	<!-- ================================================= -->

	<footer class="bg-dark text-white text-center p-3 mt-5">

		<p class="mb-0">Employee Management System &copy; 2026</p>

	</footer>


	<!-- Bootstrap JS -->

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
		
	</script>


</body>

</html>
